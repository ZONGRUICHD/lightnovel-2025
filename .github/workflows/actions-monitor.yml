name: Snapshot Actions status

on:
  push:
    branches:
      - automation-monitor
    paths:
      - ".github/workflows/actions-monitor.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            > "$RUNNER_TEMP/runs.json"
          jq '{
            generated_at: (now | todateiso8601),
            runs: [.workflow_runs[] | {
              id,
              name,
              path,
              head_branch,
              head_sha,
              event,
              status,
              conclusion,
              run_number,
              run_attempt,
              created_at,
              updated_at,
              html_url
            }]
          }' "$RUNNER_TEMP/runs.json" > actions-snapshot.json

      - name: Commit snapshot to monitor branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-snapshot.json
          git commit -m "chore: snapshot Actions status [skip ci]"
          git push origin "HEAD:automation-monitor"
